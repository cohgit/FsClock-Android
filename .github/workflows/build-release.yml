name: Build & Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Compile Debug APKs (signed, installable via ADB)
        run: ./gradlew assembleDebug

      - name: Organize Debug APK Artifacts
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk -name "*.apk" | while read f; do
            flavor=$(echo "$f" | grep -oP '(?<=apk/)[^/]+')
            cp "$f" "release-apks/fsclock-${flavor}-debug-v2.1.apk"
          done
          ls -lh release-apks/

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsclock-apks
          path: release-apks/

      - name: Compile Release APKs (for tagged releases)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease

      - name: Organize Release APK Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          find app/build/outputs/apk -name "*release*.apk" | while read f; do
            flavor=$(echo "$f" | grep -oP '(?<=apk/)[^/]+(?=/release)')
            cp "$f" "release-apks/fsclock-${flavor}-v2.1.apk"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apks/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
